<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SHD AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #333;
      font-size: 20px;
      font-weight: bold;
    }

    #chat {
      height: calc(100vh - 125px);
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 15px;
      max-width: 85%;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .ai {
      background: #292929;
      margin-right: auto;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65px;
      padding: 10px;
      display: flex;
      gap: 8px;
      background: #181818;
      border-top: 1px solid #333;
    }

    #message {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
      background: #292929;
      color: white;
    }

    #send {
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      background: white;
      color: black;
      font-weight: bold;
      font-size: 15px;
    }

    #send:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <div class="header">
    🤖 SHD AI
  </div>

  <div id="chat">
    <div class="message ai">
      မင်္ဂလာပါ 👋 ဘာမေးချင်လဲ?
    </div>
  </div>

  <div class="input-area">
    <input
      id="message"
      type="text"
      placeholder="Message SHD AI..."
      autocomplete="off"
    >

    <button id="send">Send</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("message");
    const send = document.getElementById("send");

    function addMessage(text, type) {
      const div = document.createElement("div");

      div.className = "message " + type;
      div.textContent = text;

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();

      if (text === "") return;

      addMessage(text, "user");

      input.value = "";

      // AI API ကို နောက်တစ်ဆင့်မှာ ဒီနေရာကနေ ချိတ်မယ်
      setTimeout(() => {
        addMessage("AI ကို ချိတ်ဆက်နေပါတယ်... 🤖", "ai");
      }, 500);
    }

    send.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
